# Copy this workflow into .github/workflows/repopulse.yml in your repository.
#
# Notes:
# - RepoPulse scans the GitHub repository through the API, not the checkout on
#   the runner, so no `actions/checkout` step is needed.
# - The default workflow token is enough for public repositories and rate limits.
# - The Markdown health report is written to the workflow run summary.
name: RepoPulse

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Repository health
        id: health
        uses: 3ssiri/RepoPulse@v1
        with:
          # Fail the job below 70%. Remove to report without ever failing.
          fail-under: "70"
          # Optional config file kept in the repository:
          # config: .repopulse.yml

      - name: Use the score in later steps
        run: echo "Scored ${{ steps.health.outputs.score }}/${{ steps.health.outputs.max-score }} (${{ steps.health.outputs.grade }})"

# Alternative: run the CLI directly instead of the action.
#
#   - uses: actions/setup-python@v5
#     with:
#       python-version: "3.11"
#   - run: pip install repopulse-cli
#   - run: repopulse scan "https://github.com/${{ github.repository }}" --fail-under 70 --format summary --quiet
#
# PyPI package name is `repopulse-cli` (CLI remains `repopulse`).
# Do not `pip install repopulse` — that is an unrelated package on PyPI.
