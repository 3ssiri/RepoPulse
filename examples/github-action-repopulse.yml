# Copy this workflow into .github/workflows/repopulse.yml in your repository.
# Requires GITHUB_TOKEN (provided by Actions) for private repos / higher rate limits.
#
# Notes:
# - RepoPulse scans the GitHub repository URL (via the GitHub API), not the local
#   checkout on the runner. That matches the current CLI design.
# - Optional: add --config .repopulse.yml if you keep a config file in the repo.
# - PyPI package name is `repopulse-cli` (CLI remains `repopulse`).
#   Do not `pip install repopulse` — that is an unrelated package on PyPI.
# - If not installing from PyPI, use a checkout + `pip install -e .` instead.
name: RepoPulse

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install from PyPI (package name repopulse-cli; CLI is repopulse)
      - name: Install RepoPulse
        run: pip install repopulse-cli
        # Local/dev alternative from a checkout of this project:
        # run: pip install -e ".[dev]"
      - name: Scan this repository on GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          repopulse scan "https://github.com/${REPO}" \
            --fail-under 70 \
            --format summary \
            --quiet
        # Optional config file (uncomment if present):
        #   repopulse scan "https://github.com/${REPO}" \
        #     --config .repopulse.yml \
        #     --fail-under 70 \
        #     --format summary \
        #     --quiet
