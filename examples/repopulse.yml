# Custom config example (no named profile).
# For presets, see examples/profiles/ (strict, library, docs)
# or set `profile: strict` and optionally override weights / disabled_checks.

fail_under: 85

disabled_checks:
  - activity

weights:
  readme: 25
  tests: 20
  github_actions: 20
  license: 10
  gitignore: 10
  sensitive_files: 10
  structure: 3
  package_scripts: 2
