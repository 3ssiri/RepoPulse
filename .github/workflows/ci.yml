name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Package build smoke (3.11 only)
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  # Dogfoods the published composite action against this repository.
  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run RepoPulse action
        id: health
        uses: ./
        with:
          fail-under: "70"

      - name: Assert outputs are populated
        env:
          SCORE: ${{ steps.health.outputs.score }}
          GRADE: ${{ steps.health.outputs.grade }}
          TRUNCATED: ${{ steps.health.outputs.truncated }}
        run: |
          set -euo pipefail
          echo "score=$SCORE grade=$GRADE truncated=$TRUNCATED"
          test -n "$SCORE" && test -n "$GRADE"
          test "$TRUNCATED" = "false"
