# Builds package artifacts on version tags (v*) only — not on ordinary branch pushes.
# Optional PyPI publish uses Trusted Publishing (OIDC) — no long-lived token in secrets.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default to read-only; only the job that creates the GitHub Release gets write.
permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release needs write to create the release and attach assets.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=6"
          python -m pip install -e ".[dev]"

      - name: Lint and test
        run: |
          ruff check .
          pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes to https://pypi.org/project/repopulse-cli/
  # Requires a one-time Trusted Publisher on PyPI (see docs/PUBLISHING.md).
  # Set repository variable PUBLISH_TO_PYPI=true to enable after that setup.
  publish-pypi:
    name: Publish to PyPI
    needs: build-and-release
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/repopulse-cli
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
