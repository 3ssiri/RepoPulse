# Builds package artifacts on version tags (v*) only — not on ordinary branch pushes.
# Optional PyPI publish uses Trusted Publishing (OIDC) — no long-lived token in secrets.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=6"
          python -m pip install -e ".[dev]"

      - name: Lint and test
        run: |
          ruff check .
          pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes to https://pypi.org/project/repopulse-cli/
  # Requires a one-time Trusted Publisher on PyPI (see docs/PUBLISHING.md).
  # Set repository variable PUBLISH_TO_PYPI=true to enable after that setup.
  publish-pypi:
    name: Publish to PyPI
    needs: build-and-release
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/repopulse-cli
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
