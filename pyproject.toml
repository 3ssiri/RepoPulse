[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopulse"
version = "0.2.0"
description = "A CLI tool that analyzes GitHub repository health and generates quality reports."
authors = [{ name = "Ali Assiri" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["github", "cli", "repository-health", "oss", "code-quality", "maintainer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed"
]
dependencies = [
    "typer>=0.26.8",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-PyYAML>=6.0.12.20260518",
    "build>=1.2.0"
]

[project.scripts]
repopulse = "repopulse.cli:app"

[project.urls]
Homepage = "https://github.com/3ssiri/RepoPulse"
Repository = "https://github.com/3ssiri/RepoPulse"
Issues = "https://github.com/3ssiri/RepoPulse/issues"
Changelog = "https://github.com/3ssiri/RepoPulse/blob/main/CHANGELOG.md"
Documentation = "https://github.com/3ssiri/RepoPulse/blob/main/USAGE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["repopulse*"]

[tool.ruff.lint]
# B008: Typer uses Option()/Argument() in signatures by design.
# FURB162: fromisoformat still needs Z->offset on Python 3.11.
ignore = ["B008", "FURB162"]

[tool.pytest.ini_options]
testpaths = ["tests"]
