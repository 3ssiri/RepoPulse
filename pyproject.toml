[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI.
# `repopulse` is taken; `repo-pulse` is blocked as too similar — use `repopulse-cli`.
# Import package and CLI entry point remain `repopulse`.
name = "repopulse-cli"
version = "0.3.6"
description = "A CLI tool that analyzes GitHub repository health and generates quality reports."
authors = [{ name = "Ali Assiri" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["github", "cli", "repository-health", "oss", "code-quality", "maintainer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed"
]
dependencies = [
    "typer>=0.27.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "PyYAML>=6.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "types-PyYAML>=6.0.12.20260724",
    "types-requests>=2.32.0",
    "build>=1.2.0",
    "httpx>=0.28.0"
]
web = [
    "fastapi>=0.135.0",
    "uvicorn>=0.35.0"
]

[project.scripts]
repopulse = "repopulse.cli:app"

[project.urls]
Homepage = "https://github.com/3ssiri/RepoPulse"
Repository = "https://github.com/3ssiri/RepoPulse"
Issues = "https://github.com/3ssiri/RepoPulse/issues"
Changelog = "https://github.com/3ssiri/RepoPulse/blob/main/CHANGELOG.md"
Documentation = "https://github.com/3ssiri/RepoPulse/blob/main/USAGE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["repopulse*"]

[tool.ruff.lint]
# B008: Typer uses Option()/Argument() in signatures by design.
# FURB162: fromisoformat still needs Z->offset on Python 3.11.
ignore = ["B008", "FURB162"]

# Vercel deploys webapp/app.py (the optional web layer). This table is read
# only by Vercel's Python runtime; setuptools and the PyPI distribution
# ignore it.
[tool.vercel]
entrypoint = "webapp.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
